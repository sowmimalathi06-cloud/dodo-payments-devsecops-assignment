apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-containers
  annotations:
    policies.kyverno.io/title: Disallow Root Containers
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must explicitly set runAsNonRoot=true. Scoped to the
      payments namespace only — platform/infra tooling (ArgoCD, Kyverno
      itself, ingress-nginx, kube-system) is excluded since this policy
      governs the PCI-scoped application workload, not the platform.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      validate:
        message: "Pod and container securityContext.runAsNonRoot must be explicitly set to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Images must be pinned to a specific tag, not :latest or missing a tag.
      Scoped to the payments namespace only.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      validate:
        message: "Image tag ':latest' or missing tag is not allowed. Use a pinned version or digest."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ images.containers.*.tag || '' }}"
                    operator: AnyIn
                    value: ["latest", ""]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images must be signed with Cosign (keyless) and verifiable via Rekor.
      Applies to ghcr.io images from this repo, scoped to payments namespace.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      verifyImages:
        - imageReferences:
            - "ghcr.io/*/ledger-api*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/*/ledger-api-assignment/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
